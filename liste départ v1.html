<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Liste de Départ – Version Autonome</title>

<!-- Librairies nécessaires -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    margin: 0;
    padding: 0;
}
.container {
    width: 90%;
    margin: auto;
    padding-top: 20px;
}
h1 {
    text-align: center;
    color: #333;
}
.card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
button {
    padding: 8px 15px;
    margin-top: 10px;
    border: none;
    background: #0078ff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: #005fcc;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
}
th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
th {
    background: #0078ff;
    color: white;
}
tr:hover {
    background: #f0f8ff;
}
footer {
    text-align: center;
    margin-top: 20px;
    padding: 10px;
    color: #555;
}
</style>
</head>

<body>

<div class="container">

<h1>Analyse des Classements & Génération des Listes de Départ</h1>

<!-- FICHIER INSCRITS -->
<div class="card">
    <h3>Fichier des inscrits</h3>
    <input type="file" id="fichierInscrits" accept=".csv, .xls, .xlsx">
</div>

<!-- FICHIER RESULTATS -->
<div class="card">
    <h3>Fichier des résultats</h3>
    <input type="file" id="fichierResultats" accept=".csv, .xls, .xlsx">
    <button id="btnFusion">Fusionner inscrits + résultats</button>
</div>

<!-- HEURES DE DÉPART -->
<div class="card">
    <h3>Heures de départ</h3>

    <label>Canicross :</label>
    <input type="time" id="heureCanicross" value="09:00">

    <label>Canivtt :</label>
    <input type="time" id="heureCanivtt" value="10:00">

    <label>Canipédicycle :</label>
    <input type="time" id="heureCanipedicycle" value="11:00">

    <label>Intervalle entre départs (secondes) :</label>
    <input type="number" id="intervalle" value="30" min="1">

    <button id="btnGenererListes">Générer les listes de départ</button>
</div>

<!-- TABLEAU -->
<table id="tableResultat">
    <thead>
        <tr>
            <th>Licence</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Catégorie</th>
            <th>Club</th>
            <th>Nom du chien</th>
            <th>Race</th>
            <th>Puce</th>
            <th>Moyenne</th>
            <th>Courses</th>
            <th>Discipline</th>
            <th>Heure départ</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<footer>
    Créé par <strong>Robert AURAY</strong>
</footer>

</div>

<script>
let inscrits = [];
let resultats = [];
let resultatsGlobaux = [];

// Nettoyage texte
function clean(txt) {
    if (!txt) return "";
    return txt.toString().trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// Normalisation discipline
function normaliserDiscipline(txt) {
    txt = clean(txt);
    if (txt.includes("vtt")) return "canivtt";
    if (txt.includes("ped")) return "canipedicycle";
    if (txt.includes("cross")) return "canicross";
    return txt;
}

// Lecture fichier CSV/XLS/XLSX
function lireFichier(fichier, callback) {
    const ext = fichier.name.split('.').pop().toLowerCase();

    if (ext === "csv") {
        Papa.parse(fichier, {
            header: true,
            skipEmptyLines: true,
            complete: res => callback(res.data)
        });
    } else {
        const reader = new FileReader();
        reader.onload = e => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { defval: "" });
            callback(json);
        };
        reader.readAsArrayBuffer(fichier);
    }
}

// Chargement inscrits
document.getElementById("fichierInscrits").addEventListener("change", e => {
    lireFichier(e.target.files[0], data => {
        inscrits = data;
        alert("Fichier inscrits chargé !");
    });
});

// Chargement résultats
document.getElementById("fichierResultats").addEventListener("change", e => {
    lireFichier(e.target.files[0], data => {
        resultats = calculerMoyennes(data);
        alert("Fichier résultats chargé !");
    });
});

// Calcul moyennes
function calculerMoyennes(data) {
    const groupes = {};

    data.forEach(ligne => {
        const licence = clean(ligne["Licence"]);
        const chien = clean(ligne["Nom du chien"]);
        const cle = licence + "_" + chien;

        if (!groupes[cle]) {
            groupes[cle] = {
                licence: licence,
                nom_du_chien: ligne["Nom du chien"],
                totalClassement: 0,
                nombreCourses: 0
            };
        }

        const classement = Number(ligne["classement dans la course"]);
        if (!isNaN(classement)) {
            groupes[cle].totalClassement += classement;
            groupes[cle].nombreCourses++;
        }
    });

    return Object.values(groupes).map(g => ({
        ...g,
        moyenne: (g.totalClassement / g.nombreCourses).toFixed(2)
    }));
}

// Fusion inscrits + résultats
function fusionnerInscritsResultats(inscrits, resultats) {
    return inscrits.map(inscrit => {
        const licence = clean(inscrit["Licence"]);
        const chien = clean(inscrit["#1 Chien - nom"]);

        const r = resultats.find(x =>
            clean(x.licence) === licence &&
            clean(x.nom_du_chien) === chien
        );

        return {
            licence: inscrit["Licence"],
            nom: inscrit["Nom de famille"],
            prenom: inscrit["Prénom"],
            categorie: inscrit["Catégorie"],
            club: inscrit["Club"],
            nom_du_chien: inscrit["#1 Chien - nom"],
            race: inscrit["#1 Chien - race"],
            puce: inscrit["#1 Chien - puce"],
            discipline: normaliserDiscipline(inscrit["Course"]),
            moyenne: r ? r.moyenne : "",
            nombreCourses: r ? r.nombreCourses : "",
            heure_depart: ""
        };
    });
}

// Bouton fusion
document.getElementById("btnFusion").addEventListener("click", () => {
    if (inscrits.length === 0 || resultats.length === 0) {
        alert("Veuillez charger les deux fichiers.");
        return;
    }

    resultatsGlobaux = fusionnerInscritsResultats(inscrits, resultats);
    afficherTableau(resultatsGlobaux);
});

// Affichage tableau
function afficherTableau(resultats) {
    const tbody = document.querySelector("#tableResultat tbody");
    tbody.innerHTML = "";

    resultats.forEach(r => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${r.licence}</td>
            <td>${r.nom}</td>
            <td>${r.prenom}</td>
            <td>${r.categorie}</td>
            <td>${r.club}</td>
            <td>${r.nom_du_chien}</td>
            <td>${r.race}</td>
            <td>${r.puce}</td>
            <td>${r.moyenne}</td>
            <td>${r.nombreCourses}</td>
            <td>${r.discipline}</td>
            <td>${r.heure_depart}</td>
        `;

        tbody.appendChild(tr);
    });
}

// Export CSV
function exporterCSV(data, nomFichier) {
    const csv = Papa.unparse(data);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = nomFichier;
    a.click();
}

// Génération heures départ
function genererHeuresDepart(liste, heureDepart, intervalleSec) {
    let [h, m] = heureDepart.split(":").map(Number);
    let base = new Date();
    base.setHours(h, m, 0, 0);

    return liste.map((item, index) => {
        let depart = new Date(base.getTime() + index * intervalleSec * 1000);
        let hh = depart.getHours().toString().padStart(2, "0");
        let mm = depart.getMinutes().toString().padStart(2, "0");
        let ss = depart.getSeconds().toString().padStart(2, "0");

        return {
            ...item,
            heure_depart: `${hh}:${mm}:${ss}`
        };
    });
}

// Bouton listes de départ
document.getElementById("btnGenererListes").addEventListener("click", () => {
    const hCaniCross = document.getElementById("heureCanicross").value;
    const hCaniVTT = document.getElementById("heureCanivtt").value;
    const hCaniPedi = document.getElementById("heureCanipedicycle").value;
    const intervalle = Number(document.getElementById("intervalle").value);

    const canicross = resultatsGlobaux.filter(r => r.discipline === "canicross");
    const canivtt = resultatsGlobaux.filter(r => r.discipline === "canivtt");
    const canipedicycle = resultatsGlobaux.filter(r => r.discipline === "canipedicycle");

    exporterCSV(genererHeuresDepart(canicross, hCaniCross, intervalle), "depart_canicross.csv");
    exporterCSV(genererHeuresDepart(canivtt, hCaniVTT, intervalle), "depart_canivtt.csv");
    exporterCSV(genererHeuresDepart(canipedicycle, hCaniPedi, intervalle), "depart_canipedicycle.csv");
});
</script>

</body>
</html>
